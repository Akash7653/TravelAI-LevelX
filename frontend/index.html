<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C3AED' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><polygon points='16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TravelAI — AI-Powered Personal Audio Travel Guide</title>
    <meta name="description" content="Explore the World. Listen to Its Story. Turn any destination into an immersive AI audio travel guide powered by Google Gemini and Murf AI." />
    
    <!-- Prevent theme flash: Light mode default -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('travelai-theme');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch(e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen transition-colors duration-300 antialiased selection:bg-purple-500/25 selection:text-purple-600 dark:selection:bg-purple-500/30 dark:selection:text-purple-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
